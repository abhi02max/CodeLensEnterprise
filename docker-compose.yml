name: codelens-enterprise

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-app-environment: &app-environment
  NODE_ENV: production
  API_PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-codelens}:${POSTGRES_PASSWORD:-codelens_dev_password}@postgres:5432/${POSTGRES_DB:-codelens}?schema=public
  REDIS_URL: redis://redis:6379
  ML_SERVICE_URL: http://ml-service:8000

services:
  # --------------------------------------------------------------- postgres
  # pgvector/pgvector ships the `vector` extension preinstalled.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelens_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-codelens}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-codelens} -d ${POSTGRES_DB:-codelens}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [codelens]

  # --------------------------------------------------------------- redis
  redis:
    image: redis:7-alpine
    container_name: codelens-redis
    restart: unless-stopped
    # noeviction, not allkeys-lru. This Redis holds BullMQ's queues as well as the caches,
    # and an LRU policy is free to evict a job's hash under memory pressure — the job then
    # vanishes with no error anywhere, which is the worst possible failure mode for a queue.
    # Safe to do because every cache key CodeLens writes is set with an explicit TTL, so the
    # cache bounds itself without needing eviction.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [codelens]

  # --------------------------------------------------------------- ml service
  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: codelens-ml
    restart: unless-stopped
    environment:
      ML_ARTIFACTS_DIR: /app/artifacts
      ML_ORG_ARTIFACTS_DIR: /app/org-models
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ML_MIN_SAMPLES_FOR_ORG_MODEL: ${ML_MIN_SAMPLES_FOR_ORG_MODEL:-200}
      ENABLE_LOCAL_EMBEDDINGS: ${ENABLE_LOCAL_EMBEDDINGS:-false}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      SHAP_BACKGROUND_SIZE: ${SHAP_BACKGROUND_SIZE:-100}
    ports:
      - '${ML_SERVICE_PORT:-8000}:8000'
    volumes:
      # Deliberately NOT mounting a volume over /app/artifacts. The shared model
      # bundle is baked into the image at build time, and a named volume over that
      # path shadows it: Docker seeds an empty named volume from the image exactly
      # once, then never again, so every later rebuild keeps serving the original
      # model while looking like a successful deployment.
      #
      # Only per-organization models, which are genuine runtime state produced by
      # retraining on real review history, get a volume.
      - ml_org_models:/app/org-models
    healthcheck:
      test: ['CMD', 'python', '-c', "import json,urllib.request,sys; h=json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if h.get('models_loaded') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [codelens]

  # Prisma has no checked-in migrations yet. Push the schema without accepting
  # data loss; a drift that needs destructive changes stops startup explicitly.
  db-init:
    build: *api-build
    env_file: [.env]
    environment:
      <<: *app-environment
    command: ['pnpm', '--filter', '@codelens/database', 'push:safe']
    depends_on:
      postgres: { condition: service_healthy }
    networks: [codelens]
    restart: 'no'

  # --------------------------------------------------------------- api
  api:
    build: *api-build
    container_name: codelens-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *app-environment
      RUN_WORKERS_IN_API: 'false'
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
    networks: [codelens]

  worker:
    build: *api-build
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *app-environment
      RUN_WORKERS_IN_API: 'false'
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    networks: [codelens]

  # --------------------------------------------------------------- web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: codelens-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
    networks: [codelens]

  # --------------------------------------------------------------- qdrant
  # Legacy optional service. The current RAG implementation uses pgvector;
  # enabling this profile does not redirect API retrieval to Qdrant.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codelens-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_PORT:-6333}:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [codelens]
    profiles: [qdrant]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ml_org_models:

networks:
  codelens:
    driver: bridge
